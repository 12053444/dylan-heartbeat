name: heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: beat
        env:
          SF_KEY: ${{ secrets.SF_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python heartbeat/beat.py

      - name: keepalive
        run: |
          echo "$(date -u)" > heartbeat/last_run.txt
          git config user.name "dylan"
          git config user.email "dylan@users.noreply.github.com"
          git add heartbeat/last_run.txt
          git commit -m "beat $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || true
